name: Build AX6 OpenWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ 先 checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ ⚠️ 先备份 config（关键！）
      - name: Backup config
        run: |
          echo "Backup before disk reset"
          mkdir -p /tmp/ax6
          cp -r AX6-IPQ /tmp/ax6/

      # 3️⃣ maximize（现在才安全）
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      # 4️⃣ 恢复 repo（关键）
      - name: Restore source
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          cp -r /tmp/ax6/* $GITHUB_WORKSPACE/

      # 5️⃣ 验证 config
      - name: Check config
        run: |
          ls -al AX6-IPQ
          test -f AX6-IPQ/.config

      # 6️⃣ copy config
      - name: Copy config
        run: |
          cp AX6-IPQ/.config .config

      # 7️⃣ DIY 脚本
      - name: Run DIY script
        run: |
          chmod +x $GITHUB_WORKSPACE/AX6-IPQ/diy.sh
          $GITHUB_WORKSPACE/AX6-IPQ/diy.sh

      # 8️⃣ Update feeds
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 9️⃣ Build
      - name: Build firmware
        run: |
          make defconfig
          make -j$(nproc)

      # 🔟 Upload artifacts
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: bin/
