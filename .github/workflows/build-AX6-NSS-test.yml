name: Build AX6 OpenWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ 先拉代码（必须在扩容前）
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ 最大化磁盘空间（安全版本）
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          temp-reserve-mb: 200
          swap-size-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      # 3️⃣ 基础依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-pip rsync unzip zlib1g-dev file wget

      # 4️⃣ 设置变量
      - name: Set env
        run: |
          echo "WORKDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CONFIG_FILE=$GITHUB_WORKSPACE/AX6-IPQ/.config" >> $GITHUB_ENV
          echo "DIY_SH=$GITHUB_WORKSPACE/AX6-IPQ/diy.sh" >> $GITHUB_ENV

      # 5️⃣ 检查 config 是否存在（关键！）
      - name: Check config file
        run: |
          echo "WORKSPACE:"
          ls -al $GITHUB_WORKSPACE/AX6-IPQ || true
          if [ ! -f "$GITHUB_WORKSPACE/AX6-IPQ/.config" ]; then
            echo "ERROR: .config not found!"
            exit 1
          fi

      # 6️⃣ Copy config（修复路径）
      - name: Copy config
        run: |
          cp $GITHUB_WORKSPACE/AX6-IPQ/.config .config

      # 7️⃣ DIY 脚本
      - name: Run DIY script
        run: |
          chmod +x $GITHUB_WORKSPACE/AX6-IPQ/diy.sh
          $GITHUB_WORKSPACE/AX6-IPQ/diy.sh

      # 8️⃣ Update feeds
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 9️⃣ Build
      - name: Build firmware
        run: |
          make defconfig
          make -j$(nproc)

      # 🔟 Upload artifacts
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: bin/
